name: Release

on:
  push:
    branches:
      - 1.17.x
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.2). Leave empty to auto-generate.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Read mod version from gradle.properties
        id: mod_version
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected mod version: $VERSION"

      - name: Determine tag name
        id: tag
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          MOD_VERSION="${{ steps.mod_version.outputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="v$MOD_VERSION"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="${TAG}-${SHORT_SHA}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Final tag: $TAG"

      - name: List built artifacts
        run: ls -la build/libs/

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AutoSprint ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
